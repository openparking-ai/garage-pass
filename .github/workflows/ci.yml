name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, as emails.yml already does and for the same reason.
          # The sibling-name guard below reads COMMIT MESSAGES as well as files.
          # At the default depth of 1 a pull-request checkout is one synthetic
          # merge commit, so the guard's commit half would see nothing.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: No real personal data in the repository
        # The self-test first: before trusting the result, prove the check can
        # fail. It plants a real-looking address and requires a rejection.
        run: |
          node .github/scripts/check-no-real-data.js --self-test
          node .github/scripts/check-no-real-data.js

      - name: No name from the maintainer's other software (self-test)
        run: node .github/scripts/check-no-sibling-names.js --self-test

      - name: No name from the maintainer's other software (this pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-no-sibling-names.js "$BASE..$HEAD"

      - name: No name from the maintainer's other software (whole history)
        if: github.event_name != 'pull_request'
        run: node .github/scripts/check-no-sibling-names.js

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest version supported and a current one. Nothing here may
        # quietly depend on a newer interpreter than an integrator's.
        python-version: ['3.11', '3.12']

    services:
      postgres:
        # The row-level security guarantee is about the database CATALOGUE, the
        # one-car-one-pass backstop is a database CONSTRAINT, and there is no
        # way to read either without a database. This service is what stops
        # those guarantees' tests skipping.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garage_pass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev]'

      - name: The ENGINE has no dependencies, and that is a published claim
        # `pip install -e .` with no extras must leave nothing but the package
        # itself. The `store` extra is exempt BY NAME rather than by the check
        # being loose: a driver belongs there, and nowhere else.
        run: |
          python - <<'PY'
          import importlib.metadata as md
          requires = md.distribution("openparking-garage-pass").requires or []
          runtime = [r for r in requires if "extra ==" not in r]
          assert runtime == [], f"the runtime dependency list is no longer empty: {runtime}"
          extras = sorted({
              r.split("extra ==")[1].strip().strip('"\'')
              for r in requires if "extra ==" in r
          })
          assert extras == ["dev", "store"], f"unexpected extras: {extras}"
          print("no runtime dependencies, as published")
          PY

      - name: The suite
        # NO ALLOWANCE IS NAMED, deliberately. GARAGE_PASS_ALLOW_UNRUN is the
        # only way a registered guarantee may finish a run unproven, and it is
        # empty here -- so a guarantee whose test did not run and pass fails
        # this step.
        env:
          GARAGE_PASS_TEST_DSN: >-
            host=localhost port=5432 dbname=garage_pass_test
            user=postgres password=postgres
        run: pytest -q

      - name: The database tests really ran, rather than skipping
        # The step above fails on an unrun GUARANTEE. This is the narrower check
        # on the same thing: a skipped Postgres test and a passing one both
        # leave the suite green if the guarantee guard is ever loosened.
        env:
          GARAGE_PASS_TEST_DSN: >-
            host=localhost port=5432 dbname=garage_pass_test
            user=postgres password=postgres
        run: |
          set -o pipefail
          pytest -q -m needs_postgres | tee "$RUNNER_TEMP/db.txt"
          grep -qE '[0-9]+ passed' "$RUNNER_TEMP/db.txt"
          if grep -q 'skipped' "$RUNNER_TEMP/db.txt"; then
            echo "a database test skipped, so the isolation guarantee is unproven:"
            cat "$RUNNER_TEMP/db.txt"; exit 1
          fi

      - name: The command line works with nothing but this package
        # The definition of done for a standalone module, as a check: someone
        # with no parking system points this at a few documents and gets an
        # answer. EVERY exit status is asserted, and the non-zero ones are the
        # ones that matter: a check that only ever runs the happy path cannot
        # tell a working refusal from one that reports nothing.
        run: |
          set -o pipefail
          D=tests/documents
          MOVE="--vehicle CAR-1 --lane L1 --at 2026-06-01T12:00:00-06:00"

          # A contradiction is refused, naming the field: exit 3.
          if garage-pass check-terms --pass $D/pass_contradiction.json \
               | tee "$RUNNER_TEMP/contradiction.txt"; then
            echo "a contradictory pass was accepted"; exit 1
          fi
          grep -q '"field": "valid_to"' "$RUNNER_TEMP/contradiction.txt"
          garage-pass check-terms --pass $D/pass_employee.json

          # A registered vehicle inside its window at exit: covered, exit 0.
          garage-pass access --garage $D/garage_downtown.json --pass $D/pass_employee.json \
            --registrations $D/registrations.json --visits $D/visits.json \
            --direction exit $MOVE | tee "$RUNNER_TEMP/covered.txt"
          grep -q '"outcome": "covered"' "$RUNNER_TEMP/covered.txt"

          # A vehicle on no pass, at exit: NOT covered, exit 1, and the answer
          # must say what that means at a barrier. This is the positive control
          # for the line above -- an implementation that answered "covered" to
          # everything would pass it.
          if garage-pass access --garage $D/garage_downtown.json --pass $D/pass_employee.json \
               --vehicle NOBODY --lane L1 --direction exit --at 2026-06-01T12:00:00-06:00 \
               | tee "$RUNNER_TEMP/not-covered.txt"; then
            echo "a vehicle on no pass came back covered"; exit 1
          fi
          grep -q '"reason": "NO_PASS"' "$RUNNER_TEMP/not-covered.txt"
          grep -q "An exit is never refused" "$RUNNER_TEMP/not-covered.txt" || {
            echo "it answered not-covered at exit, but without the sentence that says"
            echo "the vehicle leaves:"; cat "$RUNNER_TEMP/not-covered.txt"; exit 1; }

          # A garage that has not stated its transient mode, at entry: refused
          # to answer, exit 2, naming the field.
          garage-pass access --garage $D/garage_unstated.json --pass $D/pass_employee.json \
            --direction entry $MOVE > "$RUNNER_TEMP/refused.txt" && {
            echo "an unstated garage was answered"; exit 1; }
          test $? -eq 2 || { echo "expected exit 2"; cat "$RUNNER_TEMP/refused.txt"; exit 1; }
          grep -q '"missing": "garage.transient_available"' "$RUNNER_TEMP/refused.txt"

          echo "the module answered, and refused, for the right reasons"

  controls:
    name: controls
    runs-on: ubuntu-latest

    services:
      postgres:
        # Several controls plant into the migration, so they need the same
        # database the suite does. Without it those targets all SKIP, the
        # control cannot fire, and fail_controls.py reports it DEAD and exits 1.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garage_pass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'

      - name: Anchor pre-flight
        # Each fail-control plants a string into a source file. Editing the line
        # an anchor sits on silently retires the control that depends on it.
        # This answers that whole failure mode in a second, before the controls
        # themselves run -- and it is a separate step so a failure is visible.
        run: python scripts/fail_controls.py --anchors

      - name: Every guarantee, proven able to FAIL
        # Breaks the thing each guarantee guards and requires red. No count is
        # written here on purpose: the script derives the set from
        # tests/_guarantees.py and refuses to run if a guarantee has no control.
        env:
          GARAGE_PASS_TEST_DSN: >-
            host=localhost port=5432 dbname=garage_pass_test
            user=postgres password=postgres
        run: python scripts/fail_controls.py

      - name: The working tree is unchanged after every defect was planted
        run: git diff --exit-code

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'

      - name: Every published figure AND SENTENCE is still the generated one
        # docs/CONTRACT.md's marked blocks are DERIVED. A number or a sentence
        # edited by hand turns this red.
        run: |
          python scripts/generate_contract.py --check
          git diff --exit-code docs/CONTRACT.md

      - name: Every route-asserting sentence is judged by content, and none is false -- written or rendered
        # The registries, the guarantees, README, CONTRACT AND every string the
        # package renders (the details an operator reads) -- by AST and by import,
        # never a hand list. A sentence that says where a code comes from carries
        # a recorded judgement keyed to its CONTENT AND ITS FILE, so an edit makes
        # it unjudged -- and so does the same sentence standing in a file it was
        # not judged in -- and turns this red until someone judges it again. The
        # self-test first: a falsehood planted into a rendered detail must be named
        # before the clean reading is trusted -- and the RENDERED half proven here
        # too, on a copy of the package rendered in a subprocess with no database:
        # a run-time spelling of a falsehood and a one-word change beside a route
        # phrase both read UNJUDGED. The rendered half itself runs where every door
        # renders: the test job's full run (tests/_rendered_sentences.py, at
        # sessionfinish, on both interpreters). A step here, not a job: the
        # required contexts are exactly the seven branch protection names.
        run: |
          python scripts/sweep_route_sentences.py --self-test
          python scripts/sweep_route_sentences.py

      - name: Generation is not verification
        # The step above proves the document matches the generator. These tests
        # plant values that contradict the prose and require the prose to change.
        run: |
          set -o pipefail
          pytest tests/test_contract_is_generated.py -q | tee "$RUNNER_TEMP/docs.txt"
          if grep -q 'skipped' "$RUNNER_TEMP/docs.txt"; then
            echo "a contract plant skipped, so the derivation is unproven:"; exit 1
          fi
